<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />

    <!-- Edit these two lines with your own name / summary. -->
    <title>Alex Ababu — Software Engineer</title>
    <meta
      name="description"
      content="Selected work and background of Alex Ababu, a software engineer building tools people actually use."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Alex Ababu — Software Engineer" />
    <meta
      property="og:description"
      content="Selected work and background of Alex Ababu, a software engineer building tools people actually use."
    />

    <!-- Set the theme before first paint to avoid a flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches
          var theme = saved || (prefersLight ? 'light' : 'dark')
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          /* keep default */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
